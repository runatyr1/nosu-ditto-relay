name: ditto-relay

services:
  opensearch:
    image: opensearchproject/opensearch:2.19.0
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      # Self-hosted single-node setup: OpenSearch is reachable only on the
      # internal compose network (no published port), so it runs as plain
      # HTTP with no credentials. Do NOT publish port 9200 without also
      # re-enabling the security plugin.
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      # Raise for larger relays. Keep Xms and Xmx equal, and at or below half
      # of the RAM you are willing to give the container.
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      # Yellow counts as healthy: the relay creates its index with one
      # replica, which can never be allocated on a single node, so a
      # perfectly healthy single-node cluster sits at yellow forever.
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://localhost:9200/_cluster/health
          | grep -qE '"status":"(green|yellow)"'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  relay:
    build: .
    image: ditto-relay
    # Copy .env.example to .env and fill it in first. RELAY_URL and
    # NOSTR_SECRET_KEY are required — the relay refuses to start without them.
    env_file: .env
    environment:
      # These override .env: inside the compose network the relay always
      # listens on 13131 and reaches OpenSearch by service name, whatever
      # the host-oriented values in .env say. Credentials are cleared
      # because the bundled OpenSearch runs with security disabled.
      PORT: "13131"
      OPENSEARCH_NODE: http://opensearch:9200
      OPENSEARCH_USERNAME: ""
      OPENSEARCH_PASSWORD: ""
    ports:
      # Host port only. Set RELAY_PORT in .env to publish somewhere else;
      # PORT configures the relay *inside* the container and is fixed above.
      - "${RELAY_PORT:-13131}:13131"
    depends_on:
      opensearch:
        # The relay exits(1) if OpenSearch is unreachable during its startup
        # migration, so wait for a healthy cluster rather than crash-looping.
        condition: service_healthy
    restart: unless-stopped

volumes:
  opensearch-data:
